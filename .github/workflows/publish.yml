# Publishes @xprite/pixelate to npm when a v* tag is pushed.
# npm trusted publishing (OIDC): no npm token is stored. On npmjs.com, the package's
# Trusted Publisher must name rhinoc/xprite-pixelate and this file, publish.yml.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      # No registry-url: it writes an empty token to .npmrc, and npm then skips OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      # prepublishOnly runs typecheck, test and build.
      - run: npm publish --access public
